name: Sync Fork Weekly

on:
  schedule:
    - cron: '0 3 * * 0'   # every Sunday at 3 AM
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/thadius83/bambu-to-snapmaker-u1.git
          git fetch upstream

      - name: Merge upstream changes
        run: |
          git checkout main
          git merge upstream/main --no-edit || true

      - name: Push changes back to your fork
        run: |
          git push origin main
